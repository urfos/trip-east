<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Trip East: travel preview</title>
<link rel="stylesheet" href="characters.css">
<link rel="stylesheet" href="travel.css">
</head>
<body>
<svg id="stage"></svg>
<div class="hud" id="hud"></div>
<script src="characters.js"></script>
<script src="vehicles.js"></script>
<script src="travel.js"></script>
<script>
// Standalone preview of travelling. Tap or press any key to drive to the next city.
// Debug hashes: #at=2 (parked in city 2), #leg=1&t=0.5 (halfway through leg 1), add &public for cartoon heads, #view=overview shows the whole map, #auto=3 plays three taps.
(async function () {
  const map = await (await fetch("map.json")).json();
  const hud = document.getElementById("hud");
  const travel = TripTravel.createTravel(document.getElementById("stage"), map, {
    publicOnly: location.hash.includes("public"),
  });
  await travel.ready;

  // Every leg starts zoomed in on the vehicle and ends with a zoom out to the whole map.
  // In the app, the photo view for the arrival city opens after that zoom out.
  let at = 0, busy = false, zoomedOut = false;
  const say = (text, pulse) => { hud.innerHTML = pulse ? `<span class="pulse">${text}</span>` : text; };
  const idle = () => say(at < travel.legCount
    ? (zoomedOut ? `In ${travel.cities[at]}. ` : "") + `Tap to go to ${travel.cities[at + 1]}`
    : "The end. Tap to start over", true);

  async function advance() {
    if (busy) return;
    busy = true;
    say("");
    if (at >= travel.legCount) at = 0;
    travel.show(at);
    if (zoomedOut) { await travel.setCamera("follow"); zoomedOut = false; }
    if (at < travel.legCount) {
      await travel.travelLeg(at);
      at++;
      await travel.setCamera("overview");
      zoomedOut = true;
    }
    busy = false;
    idle();
  }

  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.has("leg")) {
    travel.setState(+hash.get("leg"), +(hash.get("t") || 0));
    busy = true;
  } else if (hash.has("at")) {
    at = +hash.get("at");
    if (at >= travel.legCount) travel.setState(travel.legCount - 1, 1); else travel.setState(at, 0);
  }
  if (hash.get("view") === "overview") { travel.setCamera("overview", { snap: true }); zoomedOut = true; }
  if (!busy) idle();

  if (hash.has("auto")) (async () => { for (let i = 0; i < +hash.get("auto"); i++) await advance(); })();

  window.addEventListener("pointerdown", advance);
  window.addEventListener("keydown", (e) => { if (!e.repeat && !e.metaKey && !e.ctrlKey) advance(); });
})();
</script>
</body>
</html>
